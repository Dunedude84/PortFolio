<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="azure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="tf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b42bc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grille décorative DevOps -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Titre -->
  <text x="400" y="52" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold">
    CLOUD-NATIVE ARCHITECTURE · AZURE AKS &amp; TERRAFORM
  </text>
  <text x="400" y="78" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="14">
    hey-hi.ca  |  biblio.hey-hi.ca  |  Zero-Trust Cloudflare Tunnel
  </text>

  <!-- Bloc 1: Cloudflare Zero-Trust -->
  <rect x="40" y="135" width="185" height="170" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="2.5"/>
  <text x="132" y="175" text-anchor="middle" fill="#fb923c" font-family="Segoe UI, sans-serif" font-size="17" font-weight="bold">Cloudflare Edge</text>
  <text x="132" y="202" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="13">Zero-Trust Tunnel</text>
  <rect x="62" y="220" width="140" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="132" y="239" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">hey-hi.ca</text>
  <rect x="62" y="258" width="140" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="132" y="277" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">biblio.hey-hi.ca</text>

  <!-- Flèche Tunnel QUIC -->
  <line x1="225" y1="220" x2="295" y2="220" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="295,214 307,220 295,226" fill="#38bdf8"/>
  <text x="265" y="205" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">QUIC TLS</text>

  <!-- Bloc 2: Microsoft Azure AKS -->
  <rect x="310" y="110" width="300" height="230" rx="14" fill="#0f172a" stroke="url(#azure)" stroke-width="2.5"/>
  <text x="460" y="140" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold">Microsoft Azure AKS (1.35)</text>
  <text x="460" y="160" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">VNet 10.10.0.0/16 · Cilium CNI</text>

  <!-- Pods à l'intérieur d'AKS -->
  <rect x="330" y="178" width="260" height="38" rx="7" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="460" y="202" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="13">Pod: cloudflared (1/1 Ready)</text>

  <rect x="330" y="228" width="125" height="45" rx="7" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="392" y="248" text-anchor="middle" fill="#4ade80" font-family="Consolas, monospace" font-size="12" font-weight="bold">horaire-app</text>
  <text x="392" y="264" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11">Node.js :3000</text>

  <rect x="465" y="228" width="125" height="45" rx="7" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="527" y="248" text-anchor="middle" fill="#4ade80" font-family="Consolas, monospace" font-size="12" font-weight="bold">biblio-app</text>
  <text x="527" y="264" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11">Node.js :3001</text>

  <rect x="330" y="285" width="260" height="36" rx="7" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="460" y="308" text-anchor="middle" fill="#d8b4fe" font-family="Consolas, monospace" font-size="12">K8s Secrets &amp; RBAC Least-Privilege</text>

  <!-- Flèche ACR / MongoDB -->
  <line x1="610" y1="175" x2="650" y2="175" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="610" y1="265" x2="650" y2="265" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Bloc 3: ACR & MongoDB -->
  <rect x="650" y="135" width="120" height="78" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="710" y="168" text-anchor="middle" fill="#d8b4fe" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Azure ACR</text>
  <text x="710" y="190" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11">Docker v1.0.2</text>

  <rect x="650" y="230" width="120" height="78" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="710" y="263" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">MongoDB</text>
  <text x="710" y="285" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11">Atlas Cloud</text>

  <!-- Barre inférieure: Terraform + GitHub Actions + PowerShell -->
  <rect x="40" y="368" width="730" height="48" rx="10" fill="#1e293b" stroke="url(#tf)" stroke-width="2"/>
  <text x="405" y="398" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="14" font-weight="bold">
    Terraform (IaC)   ·   GitHub Actions CI/CD (Trivy Scan)   ·   PowerShell Ops CLI
  </text>
</svg>
