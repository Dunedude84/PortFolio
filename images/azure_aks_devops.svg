<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="azure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="tf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b42bc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#bg)"/>

  <!-- Grille décorative DevOps -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="0" y1="72" x2="800" y2="72"/>
    <line x1="0" y1="144" x2="800" y2="144"/>
    <line x1="0" y1="216" x2="800" y2="216"/>
    <line x1="0" y1="288" x2="800" y2="288"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
  </g>

  <!-- Titre -->
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold">
    CLOUD-NATIVE ARCHITECTURE · AZURE AKS &amp; TERRAFORM
  </text>
  <text x="400" y="56" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="13">
    hey-hi.ca  |  biblio.hey-hi.ca  |  Zero-Trust Cloudflare Tunnel
  </text>

  <!-- Bloc 1: Cloudflare Zero-Trust -->
  <rect x="35" y="92" width="185" height="165" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="2.5"/>
  <text x="127" y="125" text-anchor="middle" fill="#fb923c" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">Cloudflare Edge</text>
  <text x="127" y="148" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">Zero-Trust Tunnel</text>
  <rect x="57" y="165" width="140" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="127" y="184" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">hey-hi.ca</text>
  <rect x="57" y="203" width="140" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="127" y="222" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">biblio.hey-hi.ca</text>

  <!-- Flèche Tunnel QUIC -->
  <line x1="220" y1="175" x2="290" y2="175" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="290,169 302,175 290,181" fill="#38bdf8"/>
  <text x="260" y="162" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">QUIC TLS</text>

  <!-- Bloc 2: Microsoft Azure AKS -->
  <rect x="305" y="74" width="305" height="205" rx="14" fill="#0f172a" stroke="url(#azure)" stroke-width="2.5"/>
  <text x="457" y="100" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="17" font-weight="bold">Microsoft Azure AKS (1.35)</text>
  <text x="457" y="118" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">VNet 10.10.0.0/16 · Cilium CNI</text>

  <!-- Pods à l'intérieur d'AKS -->
  <rect x="325" y="130" width="265" height="34" rx="7" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="457" y="152" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="12">Pod: cloudflared (1/1 Ready)</text>

  <rect x="325" y="174" width="127" height="44" rx="7" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="388" y="193" text-anchor="middle" fill="#4ade80" font-family="Consolas, monospace" font-size="12" font-weight="bold">horaire-app</text>
  <text x="388" y="209" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11">Node.js :3000</text>

  <rect x="463" y="174" width="127" height="44" rx="7" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="526" y="193" text-anchor="middle" fill="#4ade80" font-family="Consolas, monospace" font-size="12" font-weight="bold">biblio-app</text>
  <text x="526" y="209" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11">Node.js :3001</text>

  <rect x="325" y="228" width="265" height="34" rx="7" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="457" y="250" text-anchor="middle" fill="#d8b4fe" font-family="Consolas, monospace" font-size="11">K8s Secrets &amp; RBAC Least-Privilege</text>

  <!-- Flèche ACR / MongoDB -->
  <line x1="610" y1="130" x2="648" y2="130" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="610" y1="215" x2="648" y2="215" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Bloc 3: ACR & MongoDB -->
  <rect x="648" y="92" width="120" height="74" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="708" y="123" text-anchor="middle" fill="#d8b4fe" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Azure ACR</text>
  <text x="708" y="144" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11">Docker v1.0.2</text>

  <rect x="648" y="182" width="120" height="74" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="708" y="213" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">MongoDB</text>
  <text x="708" y="234" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11">Atlas Cloud</text>

  <!-- Barre inférieure: Terraform + GitHub Actions + PowerShell -->
  <rect x="35" y="296" width="733" height="42" rx="10" fill="#1e293b" stroke="url(#tf)" stroke-width="2"/>
  <text x="401" y="322" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="13" font-weight="bold">
    Terraform (IaC)   ·   GitHub Actions CI/CD (Trivy Scan)   ·   PowerShell Ops CLI
  </text>
</svg>
