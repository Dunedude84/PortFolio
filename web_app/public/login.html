<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Application Horaire</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css?v=1.2">
</head>

<body>
    <div class="login-container">
        <div class="login-card glass-panel">
            <div class="login-header">
                <h1>Bienvenue</h1>
                <p>Connectez-vous pour accéder à l'application.</p>
            </div>

            <div class="login-tabs">
                <button type="button" id="tab-employee" class="login-tab active">Employé</button>
                <button type="button" id="tab-admin" class="login-tab">Administrateur</button>
            </div>

            <!-- Employee login form -->
            <form id="employee-login-form">
                <div class="input-group">
                    <label for="emp-username">Nom d'utilisateur</label>
                    <input type="text" id="emp-username" name="username" required placeholder="Votre nom d'utilisateur" autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="emp-password">Mot de passe</label>
                    <input type="password" id="emp-password" name="password" required placeholder="Votre mot de passe" autocomplete="current-password">
                    <div id="employee-error-message" class="error-message"></div>
                </div>
                <button type="submit" class="submit-btn" id="employee-submit-btn">
                    <span class="btn-text">Se connecter</span>
                    <span class="loader hidden"></span>
                </button>
            </form>

            <div class="guest-divider"><span>ou</span></div>
            <button type="button" class="guest-btn" id="guest-employee-btn">👀 Visiter en mode invité (employé)</button>

            <!-- Admin login form -->
            <form id="login-form" class="hidden">
                <div class="input-group">
                    <label for="admin-username">Nom d'utilisateur</label>
                    <input type="text" id="admin-username" name="username" required placeholder="Nom d'utilisateur admin" autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required placeholder="Entrez le mot de passe" autocomplete="current-password">
                    <div id="error-message" class="error-message"></div>
                </div>
                <button type="submit" class="submit-btn" id="submit-btn">
                    <span class="btn-text">Se connecter</span>
                    <span class="loader hidden"></span>
                </button>

                <div class="guest-divider"><span>ou</span></div>
                <button type="button" class="guest-btn" id="guest-admin-btn">👀 Visiter en mode invité (admin)</button>
            </form>
        </div>
    </div>
    <script src="/js/login.js"></script>

    <!-- Signature Footer -->
    <footer class="app-footer">
        <p>Designed by VL & Systems - 2026 - All rights reserved</p>
    </footer>
</body>

</html>
